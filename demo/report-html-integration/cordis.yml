# Mounts dsh-report-html (published on npm) into this fork's CLI / Web UI so
# its report_html and report_analysis tools emit card: 'report' views.
#
# Run (headless, real model):
#   pnpm dsh --profile headless --patch ./demo/report-html-integration/cordis.yml "<task>"
# Run (Web UI):
#   pnpm dsh --profile web --patch ./demo/report-html-integration/cordis.yml
- insert:
    - id: dsh-report-html
      name: 'dsh-report-html'
